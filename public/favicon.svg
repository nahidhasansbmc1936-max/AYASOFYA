<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dark green background circle -->
  <rect width="100" height="100" rx="18" fill="#1a3a2a"/>

  <!-- Golden A with Bengali-style swirl — matches AYASOFYA brand logo -->
  <!-- Right leg of A -->
  <path d="M62 20 L78 78 L68 78 L55 38 Z" fill="url(#gold)" />
  <!-- Left leg of A (with swirl at bottom) -->
  <path d="M38 20 L22 78 L32 78 L45 38 Z" fill="url(#gold)" />
  <!-- Crossbar of A -->
  <rect x="34" y="52" width="32" height="8" rx="4" fill="url(#gold)" />
  <!-- Swirl curl at bottom-left (Bengali "o" / অ shape) -->
  <path d="M30 68 Q18 58 22 46 Q26 34 38 36 Q46 37 44 46 Q42 54 34 52"
        fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f5c518"/>
      <stop offset="50%"  stop-color="#f7d454"/>
      <stop offset="100%" stop-color="#d4920a"/>
    </linearGradient>
  </defs>
</svg>
